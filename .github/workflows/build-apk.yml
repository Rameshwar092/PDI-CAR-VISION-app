# Builds the inspector Android app (APK) on GitHub's servers.
# Runs on every push to main that changes the app, or manually:
#   GitHub -> Actions -> "Build Android APK" -> Run workflow
# Download: open the finished run -> "Artifacts" -> PDI-Car-Vision-APK
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # The APK talks to the live backend (not demo mode).
      VITE_USE_MOCK: "false"
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://pdi-car-vision-app-lsv1.vercel.app/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "PDI-Car-Vision-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PDI-Car-Vision-APK
          path: frontend/PDI-Car-Vision-*.apk
          retention-days: 30
